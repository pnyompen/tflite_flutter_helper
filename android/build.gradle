plugins {
    id "com.android.library"
    id "kotlin-android"
    id "dev.flutter.flutter-plugin-gradle-plugin"
}

group 'com.tfliteflutter.tflite_flutter_helper'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    namespace "com.tfliteflutter.tflite_flutter_helper"
    compileSdkVersion 33

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 24
    }
}
